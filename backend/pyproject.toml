[project]
name = "travel-agent"
version = "0.1.0"
description = "Travel-planning chat feature backend"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=1,<2",
    "pydantic>=2,<3",
    "tzdata",
]

[dependency-groups]
dev = [
    "pyright",
    "pytest",
    "pytest-socket",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/travel_agent"]

[tool.pytest.ini_options]
testpaths = ["tests/offline"]
addopts = "--disable-socket -p no:langsmith_plugin"
filterwarnings = [
    "error",
    # langsmith (via langgraph -> langchain-core) calls a Python 3.14-deprecated asyncio API.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:langsmith",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["travel_agent"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
